<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" height="100%" style="background-color: #0d1117; border-radius: 14px; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="sawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="topsisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="waspasGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Outer Border -->
  <rect x="1" y="1" width="1078" height="718" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Title & Subtitle Header -->
  <text x="540" y="44" text-anchor="middle" font-size="20" font-weight="800" fill="url(#headerGrad)" letter-spacing="0.5">
    TRIPLE MCDM MATHEMATICAL FORMULATION MATRIX
  </text>
  <text x="540" y="68" text-anchor="middle" font-size="12" font-weight="500" fill="#8b949e">
    Comparative Scientific Formulations for Multi-Criteria Decision Making Algorithms (m alternatives × n criteria)
  </text>

  <!-- ========================================================================= -->
  <!-- CARD 1: SAW (Simple Additive Weighting) -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 95)" filter="url(#cardShadow)">
    <rect width="320" height="595" rx="10" fill="url(#sawGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="3" fill="#38bdf8" />
    
    <rect x="16" y="14" width="60" height="18" rx="4" fill="#0369a1" />
    <text x="46" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#e0f2fe">MODEL 1</text>
    <text x="16" y="52" font-size="16" font-weight="700" fill="#f0f6fc">SAW</text>
    <text x="16" y="68" font-size="11" font-weight="500" fill="#38bdf8">Simple Additive Weighting</text>
    <text x="16" y="83" font-size="10" font-weight="400" fill="#8b949e">Pendekatan: Skala Aditif Linier (WSM)</text>
    <line x1="16" y1="94" x2="304" y2="94" stroke="#1e293b" stroke-width="1" />

    <!-- 1. Normalisasi -->
    <text x="16" y="114" font-size="11" font-weight="700" fill="#94a3b8">1. NORMALISASI SKALA LINIER (rij)</text>
    
    <!-- Benefit Formula -->
    <rect x="16" y="124" width="288" height="66" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="26" y="142" font-size="10" font-weight="600" fill="#34d399">• Kriteria Benefit (Keuntungan):</text>
    <g transform="translate(42, 150)">
      <text x="0" y="20" font-size="13" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">rij =</text>
      <!-- Fraction -->
      <g transform="translate(45, 0)">
        <text x="35" y="14" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8" font-family="'Courier New', monospace">xij</text>
        <line x1="0" y1="20" x2="70" y2="20" stroke="#f0f6fc" stroke-width="1.2" />
        <text x="35" y="33" text-anchor="middle" font-size="11" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">max(xkj)</text>
      </g>
    </g>

    <!-- Cost Formula -->
    <rect x="16" y="196" width="288" height="66" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="26" y="214" font-size="10" font-weight="600" fill="#f87171">• Kriteria Cost (Biaya/Beban):</text>
    <g transform="translate(42, 222)">
      <text x="0" y="20" font-size="13" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">rij =</text>
      <!-- Fraction -->
      <g transform="translate(45, 0)">
        <text x="35" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">min(xkj)</text>
        <line x1="0" y1="20" x2="70" y2="20" stroke="#f0f6fc" stroke-width="1.2" />
        <text x="35" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#f87171" font-family="'Courier New', monospace">xij</text>
      </g>
    </g>

    <!-- 2. Pembobotan & Nilai Preferensi -->
    <text x="16" y="286" font-size="11" font-weight="700" fill="#94a3b8">2. PREFERENSI AKHIR (Vi)</text>
    <rect x="16" y="296" width="288" height="74" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="26" y="315" font-size="10" font-weight="600" fill="#e2e8f0">Penjumlahan Terbobot (Weighted Sum Model):</text>
    <g transform="translate(65, 332)">
      <text x="0" y="22" font-size="16" font-weight="700" fill="#38bdf8" font-family="'Courier New', monospace">Vi = </text>
      <!-- Sigma -->
      <g transform="translate(42, 2)">
        <text x="12" y="24" text-anchor="middle" font-size="24" font-weight="400" fill="#f0f6fc">∑</text>
        <text x="12" y="4" text-anchor="middle" font-size="9" fill="#94a3b8">n</text>
        <text x="12" y="33" text-anchor="middle" font-size="8" fill="#94a3b8">j=1</text>
      </g>
      <text x="72" y="22" font-size="14" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">wj · rij</text>
    </g>

    <!-- 3. Karakteristik & Ringkasan -->
    <text x="16" y="394" font-size="11" font-weight="700" fill="#94a3b8">3. SPESIFIKASI ALGORITMA</text>
    <rect x="16" y="404" width="288" height="174" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 422)" font-size="10" fill="#c9d1d9">
      <text y="0"><tspan font-weight="700" fill="#f0f6fc">Bobot Kriteria:</tspan> Dikalikan saat penjumlahan</text>
      <text y="20"><tspan font-weight="700" fill="#f0f6fc">Jarak Geometris:</tspan> Tidak menggunakan jarak</text>
      <text y="40"><tspan font-weight="700" fill="#f0f6fc">Titik Acuan:</tspan> Max &amp; min lokal kolom</text>
      <text y="60"><tspan font-weight="700" fill="#f0f6fc">Kompleksitas:</tspan> O(m × n)</text>
      <text y="80"><tspan font-weight="700" fill="#f0f6fc">Karakteristik:</tspan> Komputasi instan (&lt;1ms)</text>
      <text y="100" fill="#8b949e">Kelemahan: Rentan single-spec bias</text>
      <text y="120" fill="#8b949e">Keunggulan: Mudah diaudit secara manual</text>
      <text y="140" fill="#38bdf8" font-weight="600">Rekomendasi: Screening awal cepat</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 2: TOPSIS (Ideal Solution Distance) -->
  <!-- ========================================================================= -->
  <g transform="translate(380, 95)" filter="url(#cardShadow)">
    <rect width="320" height="595" rx="10" fill="url(#topsisGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="3" fill="#34d399" />
    
    <rect x="16" y="14" width="60" height="18" rx="4" fill="#065f46" />
    <text x="46" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#d1fae5">MODEL 2</text>
    <text x="16" y="52" font-size="16" font-weight="700" fill="#f0f6fc">TOPSIS</text>
    <text x="16" y="68" font-size="11" font-weight="500" fill="#34d399">Similarity to Ideal Solution</text>
    <text x="16" y="83" font-size="10" font-weight="400" fill="#8b949e">Pendekatan: Geometri Jarak Euclidean</text>
    <line x1="16" y1="94" x2="304" y2="94" stroke="#1e293b" stroke-width="1" />

    <!-- 1. Normalisasi Vektor -->
    <text x="16" y="114" font-size="11" font-weight="700" fill="#94a3b8">1. NORMALISASI VEKTOR EUCLIDEAN</text>
    <rect x="16" y="124" width="288" height="66" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(32, 134)">
      <text x="0" y="26" font-size="13" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">rij =</text>
      <g transform="translate(44, 4)">
        <text x="48" y="14" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399" font-family="'Courier New', monospace">xij</text>
        <line x1="0" y1="20" x2="98" y2="20" stroke="#f0f6fc" stroke-width="1.2" />
        <!-- Sqrt expression -->
        <g transform="translate(4, 25)">
          <text x="0" y="14" font-size="16" fill="#34d399">√</text>
          <line x1="12" y1="4" x2="88" y2="4" stroke="#34d399" stroke-width="1.2" />
          <text x="16" y="14" font-size="16" fill="#f0f6fc">∑</text>
          <text x="32" y="14" font-size="11" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">xkj²</text>
        </g>
      </g>
    </g>

    <!-- 2. Matriks Terbobot & Solusi Ideal -->
    <text x="16" y="208" font-size="11" font-weight="700" fill="#94a3b8">2. SOLUSI IDEAL POSITIF &amp; NEGATIF</text>
    <rect x="16" y="218" width="288" height="74" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(24, 236)" font-size="10" font-family="'Courier New', monospace">
      <text y="0" fill="#c9d1d9"><tspan font-weight="700" fill="#f0f6fc">yij = wj · rij</tspan> (Matriks Terbobot)</text>
      <text y="20" fill="#34d399"><tspan font-weight="700">A⁺</tspan> = {max(yij|benefit), min(yij|cost)}</text>
      <text y="38" fill="#f87171"><tspan font-weight="700">A⁻</tspan> = {min(yij|benefit), max(yij|cost)}</text>
    </g>

    <!-- 3. Jarak Euclidean & Kedekatan Relatif -->
    <text x="16" y="310" font-size="11" font-weight="700" fill="#94a3b8">3. JARAK EUCLIDEAN &amp; KEDEKATAN (Ci)</text>
    <rect x="16" y="320" width="288" height="96" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(24, 338)">
      <text x="0" y="10" font-size="10" font-weight="600" fill="#94a3b8" font-family="'Courier New', monospace">Di± = √[ ∑ (yij - Aj±)² ]</text>
    </g>
    <g transform="translate(42, 360)">
      <text x="0" y="24" font-size="15" font-weight="700" fill="#34d399" font-family="'Courier New', monospace">Ci =</text>
      <g transform="translate(40, 0)">
        <text x="50" y="14" text-anchor="middle" font-size="13" font-weight="600" fill="#f87171" font-family="'Courier New', monospace">Di−</text>
        <line x1="0" y1="21" x2="100" y2="21" stroke="#f0f6fc" stroke-width="1.2" />
        <text x="50" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">Di+ + Di−</text>
      </g>
    </g>

    <!-- 4. Ringkasan -->
    <text x="16" y="434" font-size="11" font-weight="700" fill="#94a3b8">4. SPESIFIKASI ALGORITMA</text>
    <rect x="16" y="444" width="288" height="134" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 462)" font-size="10" fill="#c9d1d9">
      <text y="0"><tspan font-weight="700" fill="#f0f6fc">Kompleksitas:</tspan> O(m × n)</text>
      <text y="20"><tspan font-weight="700" fill="#f0f6fc">Skor Range:</tspan> 0.0000 s/d 1.0000</text>
      <text y="40"><tspan font-weight="700" fill="#f0f6fc">Karakteristik:</tspan> Memilih kompromi seimbang</text>
      <text y="60" fill="#8b949e">Anti-bias: Menghindari jebakan 1 spek dewa</text>
      <text y="80" fill="#8b949e">Keunggulan: Sangat objektif &amp; matematis</text>
      <text y="100" fill="#34d399" font-weight="600">Rekomendasi: Standar utama ranking</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 3: WASPAS (Weighted Aggregated Sum Product Assessment) -->
  <!-- ========================================================================= -->
  <g transform="translate(730, 95)" filter="url(#cardShadow)">
    <rect width="320" height="595" rx="10" fill="url(#waspasGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="3" fill="#a78bfa" />
    
    <rect x="16" y="14" width="60" height="18" rx="4" fill="#5b21b6" />
    <text x="46" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#ede9fe">MODEL 3</text>
    <text x="16" y="52" font-size="16" font-weight="700" fill="#f0f6fc">WASPAS</text>
    <text x="16" y="68" font-size="11" font-weight="500" fill="#a78bfa">Weighted Aggregated Sum Product</text>
    <text x="16" y="83" font-size="10" font-weight="400" fill="#8b949e">Pendekatan: Hibrida WSM + WPM</text>
    <line x1="16" y1="94" x2="304" y2="94" stroke="#1e293b" stroke-width="1" />

    <!-- 1. Dua Model Komputasi Dasar -->
    <text x="16" y="114" font-size="11" font-weight="700" fill="#94a3b8">1. DUAL KOMPUTASI: WSM &amp; WPM</text>
    
    <!-- WSM -->
    <rect x="16" y="124" width="288" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(24, 137)">
      <text x="0" y="14" font-size="10" font-weight="600" fill="#818cf8">• Model Aditif Linear (WSM):</text>
      <text x="12" y="32" font-size="12" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">Qi(1) = <tspan font-size="16" fill="#818cf8">∑</tspan> wj · rij</text>
    </g>

    <!-- WPM -->
    <rect x="16" y="186" width="288" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(24, 199)">
      <text x="0" y="14" font-size="10" font-weight="600" fill="#c084fc">• Model Multiplikatif (WPM):</text>
      <text x="12" y="32" font-size="12" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">Qi(2) = <tspan font-size="16" fill="#c084fc">∏</tspan> (rij)^wj</text>
    </g>

    <!-- 2. Asimilasi Hibrida WASPAS -->
    <text x="16" y="260" font-size="11" font-weight="700" fill="#94a3b8">2. FORMULA ASIMILASI HIBRIDA (λ=0.5)</text>
    <rect x="16" y="270" width="288" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(24, 290)">
      <text x="0" y="12" font-size="10" font-weight="600" fill="#e2e8f0">Skor Gabungan Integritas:</text>
      <text x="8" y="38" font-size="13" font-weight="700" fill="#a78bfa" font-family="'Courier New', monospace">Qi = λ · Qi(1) + (1 − λ) · Qi(2)</text>
      <text x="8" y="62" font-size="11" font-weight="600" fill="#38bdf8" font-family="'Courier New', monospace">Qi = 0.5·Qi(1) + 0.5·Qi(2)</text>
    </g>

    <!-- 3. Ringkasan -->
    <text x="16" y="390" font-size="11" font-weight="700" fill="#94a3b8">3. SPESIFIKASI ALGORITMA</text>
    <rect x="16" y="400" width="288" height="178" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 420)" font-size="10" fill="#c9d1d9">
      <text y="0"><tspan font-weight="700" fill="#f0f6fc">Parameter λ:</tspan> 0.5 (Keseimbangan aditif/eksponensial)</text>
      <text y="20"><tspan font-weight="700" fill="#f0f6fc">Kompleksitas:</tspan> O(m × n)</text>
      <text y="40"><tspan font-weight="700" fill="#f0f6fc">Efek WPM:</tspan> Menghukum alternatif jika ada</text>
      <text y="56" fill="#c9d1d9">kriteria bernilai sangat buruk (mendekati 0)</text>
      <text y="78"><tspan font-weight="700" fill="#f0f6fc">Efek WSM:</tspan> Memberikan stabilitas skor linier</text>
      <text y="100" fill="#8b949e">Akurasi: Menghindari deviasi ranking ekstrim</text>
      <text y="120" fill="#8b949e">Karakteristik: Paling robust terhadap outlier</text>
      <text y="140" fill="#a78bfa" font-weight="600">Rekomendasi: Pemutus seri / konsensus akhir</text>
    </g>
  </g>
</svg>